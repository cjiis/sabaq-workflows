on:
  workflow_call:
    inputs:
      platform:
        type: string
        description: Platform (web, ios, android)
        required: true
      sabaq-env:
        type: string
        description: Sabaq environment (local, dev, prod)
        required: true
      sabaq-ref:
        type: string
        description: Sabaq repo ref (branch, tag, commit, etc.)
        required: true

      app-build-number:
        type: number
        description: App build number (e.g., 100). Only required for local builds.
      development-server-host:
        type: string
        description: Development server host (e.g., localhost, staging.example.com). Only required for local builds.

env:
  SABAQ_ENV: ${{inputs.sabaq-env}}
  MOBILE_BUILD_PATH: ${{inputs.platform == 'ios' && '/tmp/sabaq.ipa' || (inputs.platform == 'android' && (inputs.sabaq-env == 'local' && '/tmp/sabaq.apk' || '/tmp/sabaq.aab')) || ''}}

jobs:
  template:
    if: false
    runs-on:
      - &ubuntu ubuntu-24.04
      - &macos xcode-27
    steps:
      - &checkout-sabaq
        uses: cjiis/sabaq-workflows/actions/checkout-sabaq@main
        with:
          token: ${{secrets.GH_PAT}}
          ref: ${{inputs.sabaq-ref}}

      - &setup-node
        uses: cjiis/sabaq-workflows/actions/setup-node@main

      - &install-dependencies
        run: npm ci

      - &build-web
        run: npm run expo export -- --platform web
        env:
          EXPO_PUBLIC_DO_NOT_USE_FIREBASE_EMULATORS: "true"
          EXPO_PUBLIC_TRPC_ENDPOINT: ${{inputs.sabaq-env == 'prod' && 'https://apiv2-3yoyqfllna-uc.a.run.app/trpc' || 'https://apiv2-drlhhmghsa-uc.a.run.app/trpc'}}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{inputs.sabaq-env == 'prod' && 'pk_live_51QBmL3Bi17HmM2BuKrxBF90aW2AjrN7fVukBRKpH5P7tEJUDjtUaj8kL3zWEXn2lnPnKbu5z8zAn1f5UmG4VJpWf00Gbz2quPA' || 'pk_test_51QBmL3Bi17HmM2BuzGCSGA4KVJxhqt8y9dPTij7tEauokrE4GA88cxpYIP65CwxlljIhqW8fm4Drq7Y3JYIGNML100njJBTv0z'}}
          EXPO_PUBLIC_SABAQ_ENV: ${{inputs.sabaq-env}}

      - &deploy-web
        run: npm run firebase -- deploy --only hosting:app --project ${{inputs.sabaq-env}} --token ${{secrets.FIREBASE_TOKEN}}

      - &setup-xcode
        uses: cjiis/sabaq-workflows/actions/setup-xcode@main

      - &setup-java
        uses: cjiis/sabaq-workflows/actions/setup-java@main

      - &build-mobile
        run: npm run build -- --non-interactive --output ${{env.MOBILE_BUILD_PATH}} --platform ${{inputs.platform}} --profile ${{inputs.sabaq-env}}
        env:
          EXPO_TOKEN: ${{secrets.EXPO_TOKEN}}
          APP_BUILD_NUMBER: ${{inputs.app-build-number}}
          DEVELOPMENT_SERVER_HOST: ${{inputs.development-server-host}}

      - &upload-artifact
        uses: cjiis/sabaq-workflows/actions/upload-artifact@main
        with:
          name: ${{inputs.platform}}
          path: ${{env.MOBILE_BUILD_PATH}}

      - &download-artifact
        uses: cjiis/sabaq-workflows/actions/download-artifact@main
        with:
          name: ${{inputs.platform}}
          path: /tmp

      - &deploy-mobile
        run: npm run eas -- submit --non-interactive --path ${{env.MOBILE_BUILD_PATH}} --platform ${{inputs.platform}} --profile ${{inputs.sabaq-env}}
        env:
          EXPO_TOKEN: ${{secrets.EXPO_TOKEN}}

  build-and-deploy-web:
    if: ${{inputs.platform == 'web'}}
    runs-on: *ubuntu
    steps:
      - *checkout-sabaq
      - *setup-node
      - *install-dependencies
      - *build-web
      - *deploy-web

  build-ios:
    if: ${{inputs.platform == 'ios'}}
    runs-on: *macos
    steps:
      - *checkout-sabaq
      - *setup-xcode
      - *setup-node
      - *install-dependencies
      - *build-mobile
      - *upload-artifact

  deploy-ios:
    if: ${{inputs.platform == 'ios'}}
    needs: build-ios
    runs-on: *ubuntu
    steps:
      - *checkout-sabaq
      - *setup-node
      - *install-dependencies
      - *download-artifact
      - *deploy-mobile

  build-android:
    if: ${{inputs.platform == 'android'}}
    runs-on: *ubuntu
    steps:
      - *checkout-sabaq
      - *setup-java
      - *setup-node
      - *install-dependencies
      - *build-mobile
      - *upload-artifact

  deploy-android:
    if: ${{inputs.platform == 'android' && inputs.sabaq-env != 'local'}}
    needs: build-android
    runs-on: *ubuntu
    steps:
      - *checkout-sabaq
      - *setup-node
      - *install-dependencies
      - *download-artifact
      - *deploy-mobile
