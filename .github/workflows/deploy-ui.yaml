run-name: Deploy UI (${{ github.event_name == 'workflow_dispatch' && 'local' || github.event.client_payload.environment }}) (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.app-build-number || github.event.client_payload.ref }})
on:
  repository_dispatch:
    types:
      - deploy-ui
  workflow_dispatch:
    inputs:
      sabaq-ref:
        description: "Sabaq repo ref (branch, tag, etc.)"
        required: true
        default: "master"
      app-build-number:
        description: "App build number (e.g., 100)"
        required: true
      development-server-host:
        description: "Development server host (e.g., localhost, staging.example.com)"
        required: false
jobs:
  deploy-ui:
    strategy:
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ios", "android"]') || fromJSON('["ios", "android", "web"]') }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cjiis/sabaq
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sabaq-ref || github.event.client_payload.ref }}
      - uses: ./.github/actions/setup-xcode
        if: ${{ matrix.platform == 'ios' }}
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/scripts
        env:
          action: deploy-ui
          platform: ${{ matrix.platform }}
          expoToken: ${{ (matrix.platform == 'ios' || matrix.platform == 'android') && secrets.EXPO_TOKEN }}
          firebaseToken: ${{ (matrix.platform == 'web' || github.event_name == 'workflow_dispatch') && secrets.FIREBASE_TOKEN }}
          environment: ${{ github.event_name == 'workflow_dispatch' && 'local' || github.event.client_payload.environment }}
          appBuildNumber: ${{ github.event.inputs.app-build-number }}
          developmentServerHost: ${{ github.event.inputs.development-server-host }}
